spring.application.name=backend

# Render/Heroku-style port binding
server.port=${PORT:8080}

# Destinatario interno para receber os pedidos de orcamento
app.company.email=${APP_COMPANY_EMAIL:macwattstestes@gmail.com}

# SMTP (obrigatorio para enviar emails)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
spring.mail.properties.mail.debug=true

logging.level.org.springframework.mail=DEBUG
logging.level.org.eclipse.angus.mail=DEBUG

# Remetente do email (se nao definido, usa spring.mail.username)
app.mail.from=${MAIL_FROM:${spring.mail.username:no-reply@localhost}}

# Envio real de email (falha se SMTP nao estiver configurado)
app.mail.skip-when-smtp-missing=false

# Resend (envia email por API, recomendado em hosts que bloqueiam SMTP)
app.resend.api-key=${RESEND_API_KEY:re_j4q9PD12_NdBDD6v5n7CMRXDZt6mvV1fv}
app.resend.from=${RESEND_FROM:onboarding@resend.dev}
app.resend.enabled=${RESEND_ENABLED:true}




# Google Static Maps (opcional). Use uma key sem restrição de referrer para o backend.
# Se quiser reutilizar a key do frontend (sem restrições), pode definir APP_MAPS_BROWSER_KEY.
app.maps.static-key=${APP_MAPS_STATIC_KEY:${APP_MAPS_BROWSER_KEY:AIzaSyDb_0_8iNV8ojyt8nbqXKt7SBVgWGc-qRs}}

