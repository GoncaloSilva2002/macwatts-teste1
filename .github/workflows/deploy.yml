name: Deploy Java App to Amazon ECS

on:
  push:
    branches:
      - goncalo-codigo # Only triggers when you push to this branch

env:
  AWS_REGION: eu-west-3
  ECR_REPOSITORY: simuladormacwatts # Your ECR repo name

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, tag, and push image to Amazon ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: latest
      run: |
        # Build the Docker container (Java Backend + HTML Frontend)
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        
        # Push the container to AWS ECR
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

    - name: Tell ECS to pull the new code
      run: |
        # This tells your live server to restart and grab the new image
        aws ecs update-service --cluster YOUR_CLUSTER_NAME --service YOUR_SERVICE_NAME